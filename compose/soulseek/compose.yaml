services:
  slskd:
    image: ghcr.io/slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "${SLSKD_PORT}:5030"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - TZ=${TZ}
    volumes:
      - ${SLSKD_CONFIG}:/app/data
      - ${DOWNLOADS}:/downloads
      - ${LIBRARY}:/music
      - ${SLSKD_YML}:/app/slskd.yml
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "soulseek"